name: CI (Formatter, Linter, Test)

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # pnpmのセットアップ（バージョン指定はpackage.jsonに書いたローカルのバージョンを取得）
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false # setup-node側のキャッシュ完了後にインストールしたいので一旦false

      # Node.jsの設定とpnpmストアのキャッシュ有効化
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "pnpm" # pnpmのグローバルキャッシュを自動で有効化

      # 依存関係のインストール（ロックファイルが厳密に一致することを確認）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biomeを使ったチェック（linter & format）
      - name: Run Biome Check
        run: pnpm run check

      # Vitestを使ったユニットテスト実行
      - name: Run Unit Tests
        run: pnpm test

      # Vitestを使ったフロントエンド結合テスト実行
      - name: Run Frontend Integration Tests
        run: pnpm test:f_integration

      # Cloudflare Workersテスト用の.dev.varsを生成(シークレットはprocess.envではなくこちら経由で注入される)
      - name: Create .dev.vars for integration tests
        run: echo 'ADMIN_TOKEN="test-admin-token"' > .dev.vars

      # Vitest + Cloud Workersを使った結合テスト実行
      - name: Run Worker Integration Tests
        run: pnpm test:integration
