name: Gemini PR Review

on:
  pull_request:
    types: [opened, synchronize]   # PR作成時と、開いた後の追加プッシュ時に起動

permissions:
  contents: read
  pull-requests: write

jobs:
  gemini-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4   # 安定版の v4 を指定

      - name: Run Gemini CLI PR Review
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          prompt: '/review'         # workflow から prompt: '/review' に修正
          gemini_model: 'gemini-3.1-flash-lite' # すぐ超過する
